<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>TaskFlow</title>
    <style>
        .opacity-75 { opacity: 0.6; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-body-tertiary transition-all">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <span class="navbar-brand fw-bold">TaskFlow Manager</span>
            <button class="btn btn-outline-light btn-sm" id="darkModeToggle">Toggle Dark Mode</button>
        </div>
    </nav>
    <div class="container">
        {% block body %}{% endblock %}
    </div>

    <script>
        const toggle = document.getElementById('darkModeToggle');
        const html = document.documentElement;

        toggle.addEventListener('click', () => {
            if (html.getAttribute('data-bs-theme') === 'dark') {
                html.setAttribute('data-bs-theme', 'light');
                toggle.className = 'btn btn-outline-light btn-sm';
            } else {
                html.setAttribute('data-bs-theme', 'dark');
                toggle.className = 'btn btn-light btn-sm';
            }
        });
    </script>
</body>
</html>
