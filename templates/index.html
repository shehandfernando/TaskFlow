{% extends 'base.html' %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form action="/" method="POST" class="row g-2">
                    <div class="col-md-7">
                        <input type="text" name="content" class="form-control" placeholder="Add a new task..." required>
                    </div>
                    <div class="col-md-3">
                        <select name="priority" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Add</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="btn-group shadow-sm">
                <a href="/?filter=all" class="btn btn-sm btn-outline-secondary {% if current_filter == 'all' %}active{% endif %}">All</a>
                <a href="/?filter=active" class="btn btn-sm btn-outline-secondary {% if current_filter == 'active' %}active{% endif %}">Active</a>
                <a href="/?filter=completed" class="btn btn-sm btn-outline-secondary {% if current_filter == 'completed' %}active{% endif %}">Completed</a>
            </div>
            <span class="badge bg-dark">{{ pending }} tasks left</span>
        </div>

        <div class="list-group shadow-sm">
            {% for task in tasks %}
            <div class="list-group-item d-flex justify-content-between align-items-center {% if task.completed %}bg-light opacity-75{% endif %}">
                <div>
                    <span class="badge {% if task.priority == 'High' %}bg-danger{% elif task.priority == 'Medium' %}bg-warning text-dark{% else %}bg-info{% endif %} me-2">
                        {{ task.priority }}
                    </span>
                    <span style="{% if task.completed %}text-decoration: line-through; color: gray;{% endif %}">
                        {{ task.content }}
                    </span>
                </div>
                <div>
                    <a href="/update/{{task.id}}" class="btn btn-sm {% if task.completed %}btn-secondary{% else %}btn-success{% endif %}">
                        {% if task.completed %}↺{% else %}✓{% endif %}
                    </a>
                    <a href="/delete/{{task.id}}" class="btn btn-sm btn-outline-danger border-0">✕</a>
                </div>
            </div>
            {% else %}
            <div class="list-group-item text-center text-muted py-4">
                No tasks found. Time to relax!
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
